name: Deploy test-sales-and-dev-leads to Staging AWS Account

on: workflow_dispatch

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: setup node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          always-auth: true
          node-version: "24"
          registry-url: https://registry.npmjs.org
          scope: "@activeprospect"
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # demoConfig/keys.json holds the LeadConduit API keys used for automated
      # feedback. It is gitignored and injected at deploy time. The bundling
      # plugin (serverless-plugin-include-dependencies) statically resolves the
      # require('./demoConfig/keys.json') in index.js, so the file must exist
      # before packaging.
      - name: Write demoConfig/keys.json
        run: |
          mkdir -p demoConfig
          printf '%s' "$TESTLEAD_DEMO_KEYS" > demoConfig/keys.json
        env:
          TESTLEAD_DEMO_KEYS: ${{ secrets.TESTLEAD_DEMO_KEYS }}

      - name: install osls deploy framework
        run: npm i -g osls@3.70.0 --ignore-scripts

      - name: osls deploy
        run: osls deploy --stage staging
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
