name: Deploy test-sales-and-dev-leads to Staging AWS Account

on: workflow_dispatch

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: setup node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          always-auth: true
          node-version: "24"
          registry-url: https://registry.npmjs.org
          scope: "@activeprospect"
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Assume the dedicated least-privilege deploy role via GitHub OIDC. No
      # long-lived AWS keys are stored as secrets. The role resolves the SSM
      # DEMO_KEYS parameter at deploy time and creates/updates the stack.
      - name: Configure AWS Credentials Action For GitHub Actions
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # v6.0.0
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::371005981288:role/testlead-deployer
          role-session-name: testlead-deploy-github

      - name: install osls deploy framework
        run: npm i -g osls@3.70.0 --ignore-scripts

      - name: osls deploy
        run: osls deploy --stage staging
