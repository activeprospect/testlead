name: test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          always-auth: true
          node-version: '24'
          registry-url: https://registry.npmjs.org
          scope: "@activeprospect"
          cache: 'npm'
      - run: npm ci
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: npm run lint
      - run: npm test

  validate-serverless-template:
    name: validate serverless template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          always-auth: true
          node-version: '24'
          registry-url: https://registry.npmjs.org
          scope: "@activeprospect"
          cache: 'npm'
      - run: npm ci
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: npm i -g osls@3.70.0
      # DEMO_KEYS is set here so serverless.yml resolves it from the env (the
      # first source in ${env:DEMO_KEYS, ssm:..., '{}'}) and never calls AWS,
      # letting packaging run without credentials.
      - run: serverless package --stage staging
        env:
          AWS_REGION: 'us-east-1'
          AWS_ACCOUNT_ID: '000000000000'
          DEMO_KEYS: '{}'
