service: test-sales-and-dev-leads

frameworkVersion: "3"

package:
  individually: true
  # serverless-plugin-include-dependencies excludes node_modules then adds back
  # only the files the handler actually requires, so dev dependencies are never
  # bundled. excludeDevDependencies is left false to defer entirely to the
  # plugin (and skip Serverless's own slower dev-dependency pruning pass).
  excludeDevDependencies: false

plugins:
  - serverless-plugin-include-dependencies

provider:
  name: aws
  stage: staging
  region: us-east-1
  runtime: nodejs24.x
  architecture: x86_64
  memorySize: 128
  timeout: 60
  environment:
    # Demo API keys (account name -> LeadConduit API key). Resolution mirrors
    # lib/demokeys.js precedence: an explicit DEMO_KEYS env var wins, otherwise
    # the SSM SecureString (Doppler-managed) is read by the deploying identity at
    # deploy time, otherwise '{}'. The env fallback lets `serverless package` run
    # credential-free (the CI validate job sets DEMO_KEYS); a real deploy leaves
    # it unset so the value comes from SSM. lib/demokeys.js reads this at runtime.
    DEMO_KEYS: ${env:DEMO_KEYS, ssm:/test-sales-and-dev-leads/DEMO_KEYS, '{}'}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - s3:GetObject
          Resource: arn:aws:s3:::sales-and-dev-leads-config/*

functions:
  testLeads:
    name: test-sales-and-dev-leads
    handler: index.lambda
    events:
      - schedule: rate(1 minute)
